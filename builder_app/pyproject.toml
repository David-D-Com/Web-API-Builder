[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web-api-builder"
version = "0.1.0"
description = "Qt6 desktop app for managing browser-derived web API modules."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Local project workspace" }
]
dependencies = [
  "PySide6>=6.8",
  "PyYAML>=6.0",
]

[project.scripts]
web-api-builder = "web_api_builder.qt_app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
