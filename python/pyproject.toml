[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soliscloud-web-api"
version = "0.1.0"
description = "Unofficial Python client for the SolisCloud web API derived from the live web application."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Local project workspace" }
]
keywords = ["solis", "soliscloud", "solar", "api"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["rich>=13.7"]

[project.optional-dependencies]
windows-credentials = ["keyring>=25.0"]
dev = ["build>=1.2", "twine>=5.0"]

[project.scripts]
soliscloud-web-api = "soliscloud_web_api.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
